name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Analisis estatico
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar ruff
        run: pip install ruff

      - name: Revisar estilo y errores
        run: ruff check app tests

  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Ejecutar pruebas con cobertura
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-py${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: Verificar aplicacion
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar que la aplicacion carga
        run: python -c "from app.main import app; print('Aplicacion cargada correctamente')"